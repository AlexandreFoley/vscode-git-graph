name: CI

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [16.x]
        include:
          # Test additional Node versions on Ubuntu only
          - os: ubuntu-latest
            node-version: 14.x
          - os: ubuntu-latest
            node-version: 18.x
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      run: npm install
    
    - name: Lint
      run: npm run lint
    
    - name: Build
      run: npm run compile
    
    - name: Run tests
      run: npm run test:unit
    
    - name: Check for compilation artifacts
      run: |
        if [ ! -d "out" ]; then
          echo "Error: out directory not found after compilation"
          exit 1
        fi
      shell: bash
